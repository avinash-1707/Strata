# Production stack for the Ubuntu target (DD-027). Not for the Mac: this file is
# the only place Ollama appears, and model weights never land on the dev machine.
#
# Provisioning, in order. Each step is blocking and fails loudly:
#
#   cd /opt/strata
#   cp .env.example .env && $EDITOR .env    # POSTGRES_PASSWORD has no default
#   docker compose -f docker-compose.prod.yml up -d --wait          # substrate
#   docker compose -f docker-compose.prod.yml run --rm ollama-pull  # models
#   docker compose -f docker-compose.prod.yml --profile app build   # app image
#
# The pull is `run`, not a dependency of `up`: `--wait` reports a service with no
# healthcheck as satisfied the moment it is *running*, so it returns 0 both while
# a multi-GB pull is still downloading and after that pull has exited non-zero.
# Gating provisioning on it would tick "both models respond" on a signal carrying
# no information. `run` is synchronous and propagates the exit code.
#
# docker-compose.yml (dev) stays separate and unchanged: scripts/integration.sh
# invokes plain `docker compose`, and folding these together would point the
# integration run at a persistent database.

name: strata

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: strata
      # Fails the `up` outright when unset, rather than booting a LAN-reachable
      # database with the dev password baked into docker-compose.yml.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: strata
    # The durable half of the system. Unlike the dev stack (DD-030), this volume
    # is the memory store — `down -v` here destroys every memory.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports`. Postgres is reached only over the compose network by `strata`;
    # publishing it would expose the store to the whole LAN with one password.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strata -d strata"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Two distinct settings, for two distinct failure modes:
    #
    # No persistence (--save "", --appendonly no): the corpus version counter and
    # the cache entries it scopes must share a lifetime. Surviving a restart
    # asymmetrically is what resurrects a stale generation.
    #
    # --maxmemory-policy noeviction: the version key carries no TTL while recall
    # entries do. Under an LRU policy the version key can be evicted while the
    # entries it scopes survive; the counter then resets to 0, a later INCR
    # re-yields a version those entries were already cached under, and a
    # pre-forget generation becomes servable again — the DD-044 defect
    # reintroduced by an eviction policy. Fail the write instead.
    #
    # maxmemory is set explicitly because noeviction is already Redis's default:
    # without a ceiling the policy is inert and the real behaviour is unbounded
    # growth until the host OOM-killer takes the whole box. A bounded cache that
    # refuses writes is the better failure. Note the cost of that refusal: under
    # OOM, noeviction rejects every denyoom command — INCR included — so a
    # `forget` bump can fail while reads keep serving. src/tools/corpus.ts logs
    # that and continues, bounding the stale window at the 300s entry TTL.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama:
    # Pinned, not :latest, and the floor is not arbitrary: /api/embed landed in
    # v0.3.4 (older builds 404 it) and JSON-Schema-valued `format` in v0.5.0 —
    # src/ollama/client.ts uses both. An unpinned tag also risks the opposite
    # failure: ollama#11214 saw nomic-embed-text's effective n_ctx silently drop
    # 8192 -> 2048 between two point releases. Re-run scripts/truth-find.ts before
    # changing this (DD-029).
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.32.6}
    restart: unless-stopped
    environment:
      # Both models stay resident. With the default of 1 they evict each other on
      # every alternating embed/generate call, and a cold reload on CPU costs far
      # more than it does on a GPU (DD-028).
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ollama:/root/.ollama
    # Not published: only `strata` and the pull job call it. The truth-finding
    # script reaches it over SSH port-forward instead (scripts/truth-find.ts).
    healthcheck:
      # `ollama list` round-trips the HTTP API, so this gates on the server
      # answering rather than on the process existing. Models load lazily per
      # request, so this says nothing about whether either model is present —
      # that is the pull step's job.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30

  # Provisioning step, not a boot dependency — see the header. Profiled so `up`
  # cannot fire it and forget it. Idempotent: an already-present model is a no-op.
  ollama-pull:
    profiles: ["pull"]
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.32.6}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # Points the CLI at the server container instead of its own (unstarted) one.
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set EMBEDDING_MODEL in .env}
      INSTRUCT_MODEL: ${INSTRUCT_MODEL:?set INSTRUCT_MODEL in .env}
    entrypoint: ["/bin/sh", "-c"]
    # $$ escapes compose interpolation so the shell expands these, not compose.
    command: ['ollama pull "$${EMBEDDING_MODEL}" && ollama pull "$${INSTRUCT_MODEL}"']
    restart: "no"

  # Behind a profile, so `up` above starts the substrate and stops. That is
  # deliberate: src/main.ts serves MCP over stdio only, so there is no long-running
  # server to detach — the process lives exactly as long as one client session.
  # A long-running app service only becomes coherent when Phase 12 picks the
  # cross-host transport (DD-026). Until then the client starts one per session:
  #
  #   ssh ubuntu 'cd /opt/strata && docker compose -f docker-compose.prod.yml \
  #     run --rm -T strata'
  #
  # `cd` is required: ssh runs in $HOME, where the relative -f path, env_file, and
  # build context all resolve to the wrong directory. -T keeps stdin/stdout raw
  # pipes; a TTY would corrupt the JSON-RPC framing. (Compose writes its own
  # progress to stderr, so stdout stays a clean protocol channel — DD-026.)
  #
  # WARNING — do not adopt this shape for concurrent clients before DD-045 lands.
  # main.ts runs repairPass at boot and every REPAIR_INTERVAL_MS, so N sessions
  # means N passes over one backlog, double-counting enhancement_attempts against
  # a cap of 5; and with no session open, nothing repairs at all. DD-045's
  # advisory lock plus a dedicated repair service is Phase 6 work.
  strata:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    # Named and never pulled, so `run` starts an already-built image instead of
    # compiling TypeScript inside the client's server-launch path — a build there
    # would outlast any client startup timeout. Build is a provisioning step.
    image: strata:local
    pull_policy: never
    env_file: .env
    # Single source of truth for the password: .env carries POSTGRES_PASSWORD, and
    # a hand-written POSTGRES_URL in the same file would silently drift from it.
    environment:
      POSTGRES_URL: postgres://strata:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/strata
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Deliberately NOT the pull job. `run` re-executes its dependencies, so
      # gating here would make every session shell out to registry.ollama.ai —
      # which fails outright offline, contradicting the local-first premise. A
      # missing model instead degrades one write to status:'raw', which is the
      # path DD-005 exists to survive.
      ollama:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
